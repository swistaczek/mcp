[project]
name = "mcp-servers"
version = "0.1.0"
description = "Personal MCP servers collection"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.3",
    "google-genai>=2.33.0",
    "Pillow>=13.0.0",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pillow-heif>=1.8.1",
    "aioresponses>=0.7.9",
    "pypdf>=6.21.2",
    "pyusb>=1.3.1",
    "segno>=1.6.6",
    "google-auth>=2.62.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["domains", "gemini_image_descriptions", "tablica", "exif_extractor", "plate_recognition", "ovh_verifier", "czynaczas", "gazetki", "krs", "poznan_events", "poznan_bip", "poznan_smart_city", "poznan_noise", "label_printer", "escpos_printer", "google_ads_planner"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
